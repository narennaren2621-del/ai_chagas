name: chagas_predictor
description: A Chagas disease prediction companion app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  image_picker: ^0.8.8+7
  http: ^1.6.0
  file_picker: ^8.1.7
  pdf: ^3.13.0
  printing: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/signals_features.csv
    - assets/models/chagas_lstm.tflite
    - assets/models/model_info.json
    - assets/models/feature_names.txt
